name: Bug report
description: Something is not working as expected
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Web
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and device
      placeholder: "1.0.0, Pixel 8, Android 15"
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Do not include real financial data.
